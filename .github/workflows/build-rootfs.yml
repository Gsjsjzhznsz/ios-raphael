# build-rootfs.yml — 一键生成 ios16-root.simg（iOS 16.7.16 / 20H392, iPhone10,3）
# 运行在 macOS runner：hdiutil 原生挂 APFS dmg、原生建大小写敏感日志式 HFS+
# （ubuntu runner 内核无 hfsplus 模块，已放弃 Linux 路线）
# 产物：GitHub Release 的 ios16-root.simg.part-*（≤1900MiB/卷）+ CHECKSUMS.txt
# 主机端合并：cat ios16-root.simg.part-* > ios16-root.simg
# 刷写：fastboot -S 512M flash userdata ios16-root.simg

name: build-ios-rootfs

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: '可选：手动指定 IPSW 直链（留空=自动解析 iPhone10,3 iOS 16.7.16）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  rootfs:
    runs-on: macos-14
    timeout-minutes: 150

    steps:
      - name: Checkout（tools/sweet-root-tweaks.py + tools/img2simg.py）
        uses: actions/checkout@v4

      - name: 解析 IPSW 直链（iPhone10,3 / iOS 16.7.16 / 20H392）
        id: ipsw
        env:
          IPSW_URL: ${{ github.event.inputs.ipsw_url }}
        run: |
          set -e
          URL=""
          if [ -n "$IPSW_URL" ]; then
            URL="$IPSW_URL"
          else
            # ipsw.me 解析（带重试）；失败则回退到已验证的 Apple CDN 直链
            for i in 1 2 3; do
              J=$(curl -sL --max-time 30 "https://api.ipsw.me/v4/device/iPhone10,3" || true)
              URL=$(printf '%s' "$J" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(f['url'] for f in d['firmwares'] if f['version']=='16.7.16'))" 2>/dev/null || true)
              [ -n "$URL" ] && break
              sleep 5
            done
            [ -n "$URL" ] || URL="https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          fi
          # 直链可达性预检
          code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 30 "$URL")
          if [ "$code" != "200" ] && [ "$code" != "302" ]; then
            echo "::error::IPSW 直链不可达（HTTP $code）：$URL"
            exit 1
          fi
          echo "IPSW_URL=$URL (HTTP $code)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: 下载 IPSW 并只解出三个 dmg（OS / SystemOS / AppOS）
        env:
          URL: ${{ steps.ipsw.outputs.url }}
        run: |
          set -e
          echo "== 下载 IPSW（约 5.9GB）=="
          curl -L --retry 3 --retry-delay 5 -o /tmp/ipsw.zip "$URL"
          python3 - <<'PY'
          import plistlib, zipfile, os, sys
          z = zipfile.ZipFile('/tmp/ipsw.zip')
          names = z.namelist()
          bm = [n for n in names if n.endswith('BuildManifest.plist')][0]
          pl = plistlib.loads(z.read(bm))
          picked = {}
          WANTS = (('OS', 'OS'), ('SystemOS', 'Cryptex1,SystemOS'), ('AppOS', 'Cryptex1,AppOS'))
          for ident in pl.get('BuildIdentities', []):
              man = ident.get('Manifest') or {}
              for want, key in WANTS:
                  if want in picked:
                      continue
                  for node in (man.get(key), ident.get(key)):
                      path = (node or {}).get('Info', {}).get('Path') if isinstance(node, dict) else None
                      if path and path in names:
                          picked[want] = path
                          break
              if len(picked) == 3:
                  break
          if len(picked) != 3:
              print('BuildManifest 未凑齐，回退到体积启发式，候选：')
              dmgs = sorted(
                  [(z.getinfo(n).file_size, n) for n in names
                   if n.endswith('.dmg') and not os.path.basename(n).startswith('rr')],
                  reverse=True)
              for s, n in dmgs:
                  print(f'  {s/1e9:6.2f}GB  {n}')
              if len(dmgs) < 3:
                  sys.exit('IPSW 里找不到三个 dmg')
              for want, (_, n) in zip(('OS', 'SystemOS', 'AppOS'), dmgs[:3]):
                  picked[want] = n
          os.makedirs('dmgs', exist_ok=True)
          for want, path in picked.items():
              print(f'{want:9s} -> {path}')
              z.extract(path, 'dmgs')
          with open('dmgs/map.txt', 'w') as f:
              for w, p in picked.items():
                  f.write(f'{w}\t{p}\n')
          PY
          rm -f /tmp/ipsw.zip
          df -h /

      - name: 挂载三个 APFS dmg（hdiutil，原生解压 LZBITMAP）
        run: |
          set -e
          mkdir -p m_os m_sysos m_appos
          mount_one() {
            local f="$1" mp="$2"
            local disk before after mp_found
            before=$(mount | awk '{print $3}' | sort)
            disk=$(hdiutil attach -readonly -nomount "$f" | grep -o '^/dev/disk[0-9]*' | head -1)
            echo "attached $f -> $disk"
            diskutil mountDisk "$disk" || diskutil mount readOnly "${disk}s1" || true
            after=$(mount | awk '{print $3}' | sort)
            # 卷可能挂在合成盘上（APFS container diskN -> 卷 diskM+sN），用挂载快照差分找
            mp_found=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | head -1)
            [ -n "$mp_found" ] || { echo "::error::$f 挂载失败"; diskutil list; exit 1; }
            echo "mounted $f at $mp_found"
            echo "$mp_found" > "$mp.txt"
          }
          OS_D=$(awk -F'\t' '$1=="OS"{print "dmgs/"$2}' dmgs/map.txt)
          SYS_D=$(awk -F'\t' '$1=="SystemOS"{print "dmgs/"$2}' dmgs/map.txt)
          APP_D=$(awk -F'\t' '$1=="AppOS"{print "dmgs/"$2}' dmgs/map.txt)
          mount_one "$OS_D"   m_os
          mount_one "$SYS_D"  m_sysos
          mount_one "$APP_D"  m_appos

      - name: 建 16G 大小写敏感日志式 HFS+ 并三段拷贝（等价 mkiosroot.sh）
        run: |
          set -e
          M_OS=$(cat m_os.txt); M_SYS=$(cat m_sysos.txt); M_APP=$(cat m_appos.txt)
          # OS 卷的根：apfs-fuse 布局是 <mount>/root，macOS 原生挂载就是卷根。
          # 兼容两种布局：若存在 root 子目录则用它。
          [ -d "$M_OS/root" ] && M_OS="$M_OS/root"
          [ -d "$M_SYS/root" ] && M_SYS="$M_SYS/root"
          [ -d "$M_APP/root" ] && M_APP="$M_APP/root"
          echo "== 建 16G UDRW HFSX+J =="
          hdiutil create -size 16g -type UDRW -fs "Case-sensitive Journaled HFS+" \
            -volname iOSRoot -layout NONE -o ios16-root.dmg
          mkdir -p m_root
          hdiutil attach -owners on -mountpoint "$PWD/m_root" ios16-root.dmg
          copy() {
            echo "copying $1 -> $2"
            sudo mkdir -p "$2"
            sudo rsync -aH --numeric-ids "$1/" "$2/" || {
              echo "rsync 不可用（openrsync?），改用 ditto"
              sudo ditto "$1" "$2"
            }
          }
          copy "$M_OS/"   "$PWD/m_root"
          copy "$M_SYS/"  "$PWD/m_root/private/preboot/Cryptexes/OS"
          copy "$M_APP/"  "$PWD/m_root/private/preboot/Cryptexes/App"

          # dyld 共享缓存硬链接（ignition_level=1 查找路径）
          dsc="private/preboot/Cryptexes/OS/System/Library/Caches/com.apple.dyld"
          sudo mkdir -p "$PWD/m_root/System/Library/Caches/com.apple.dyld"
          for f in "$PWD/m_root/$dsc"/*; do
            sudo ln "$f" "$PWD/m_root/System/Library/Caches/com.apple.dyld/${f##*/}"
          done
          # cryptex 内独有文件补链到根路径
          for c in OS App; do
            (cd "$PWD/m_root/private/preboot/Cryptexes/$c" && sudo find . ! -type d ! -path './System/Library/Caches/com.apple.dyld/*') |
            while IFS= read -r f; do
              f=${f#./}
              if ! sudo test -e "$PWD/m_root/$f" && ! sudo test -L "$PWD/m_root/$f"; then
                sudo mkdir -p "$PWD/m_root/$(dirname "$f")"
                src="$PWD/m_root/private/preboot/Cryptexes/$c/$f"
                if sudo test -L "$src"; then sudo cp -P "$src" "$PWD/m_root/$f"; else sudo ln "$src" "$PWD/m_root/$f"; fi
                echo "linked $c:/$f"
              fi
            done
          done
          # logd 日志库（属主 272/_logd）+ 迁移标记
          db="$PWD/m_root/private/var/db"
          sudo install -d -o 272 -g 272 -m 0751 "$db/diagnostics"
          sudo install -d -o 272 -g 272 -m 0755 "$db/uuidtext" "$db/diagnostics/timesync"
          for d in diagnostics uuidtext diagnostics/timesync; do
            sudo install -o 272 -g 272 -m 0644 /dev/null "$db/$d/.migrated"
          done
          # 系统钥匙包（无密码 keybag）
          sudo install -d -m 0700 -o 0 -g 0 "$PWD/m_root/private/var/keybags"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>KeyBagKeys</key><data>U1dFRVQ=</data></dict></plist>' |
            sudo install -m 0600 -o 0 -g 0 /dev/stdin "$PWD/m_root/private/var/keybags/systembag.kb"
          df -h "$PWD/m_root" || true

      - name: bring-up 补丁（sweet-root-tweaks.py）并卸载
        run: |
          set -e
          sudo python3 tools/sweet-root-tweaks.py "$PWD/m_root"
          hdiutil detach -force "$PWD/m_root" || hdiutil detach -force "$(hdiutil info | grep ios16-root -B5 | grep '^/dev/disk' | head -1)" || true
          # 卸载三个 dmg
          for mp in $(cat m_os.txt m_sysos.txt m_appos.txt); do
            dev=$(mount | grep " on $mp " | grep -oE '^/dev/disk[0-9]+(s[0-9]+)?' | head -1)
            [ -n "$dev" ] && diskutil eject -force "$dev" || true
          done
          df -h /

      - name: fsck_hfs 校验
        run: |
          set -e
          FSCK=$(command -v fsck_hfs || echo /System/Library/Filesystems/hfs.fs/Contents/Resources/fsck_hfs)
          DISK=$(hdiutil attach -readonly -nomount ios16-root.dmg | grep -o '^/dev/disk[0-9]*' | head -1)
          echo "fsck on $DISK"
          "$FSCK" -f -y "$DISK" | tail -8
          "$FSCK" -f -n "$DISK" | tail -3
          hdiutil detach -force "$DISK"

      - name: 转稀疏镜像 + 1900MiB 分卷（纯 Python img2simg）
        run: |
          set -e
          python3 tools/img2simg.py ios16-root.dmg ios16-root.simg 1900
          rm -f ios16-root.dmg
          ls -lh ios16-root.simg ios16-root.simg.part-*
          shasum -a 256 ios16-root.simg ios16-root.simg.part-* > CHECKSUMS.txt
          cat CHECKSUMS.txt
          df -h /

      - name: 上传到 GitHub Release（永久直链）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-rootfs-16.7.16-${{ github.run_number }}
          name: ios16-root 16.7.16 (20H392) sparse
          body: |
            iOS 16.7.16 (20H392) iPhone10,3 rootfs，HFS+ 16G 稀疏镜像。
            下载全部 part-* 与 CHECKSUMS.txt，在主机端：
              cat ios16-root.simg.part-* > ios16-root.simg
              shasum -a 256 -c <(grep ' ios16-root.simg$' CHECKSUMS.txt)
            刷写：fastboot -S 512M flash userdata ios16-root.simg
            会清空 userdata（全部 Android 数据），bootloader/恢复/基带分区不受影响。
          files: |
            ios16-root.simg.part-*
            CHECKSUMS.txt

      - name: 上传 workflow artifact（备用下载通道，保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-simg
          path: |
            ios16-root.simg.part-*
            CHECKSUMS.txt
