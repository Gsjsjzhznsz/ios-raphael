name: raphael

on:
  workflow_dispatch: {}

jobs:
  shim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          which aarch64-linux-gnu-gcc

      - name: Build shim (RAPHAEL)
        run: |
          # Empty ramdisk: diagnostics-only image; the real payload comes from
          # tools/mkpayload.py (see README.md). RAPHAEL=1 selects the
          # 1080x2340 console and the SM8150 imem restart-reason address.
          (cd shim && RAPHAEL=1 ./build.sh)
          mkdir -p shim-raphael
          cp shim/out/Image shim-raphael/Image
          cp shim/out/shim.elf shim-raphael/shim.elf
          cp shim/out/ramdisk.bin shim-raphael/ramdisk-diagnostics.bin

      - name: Upload shim binaries
        uses: actions/upload-artifact@v4
        with:
          name: raphael-shim
          path: shim-raphael/
